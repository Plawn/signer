[package]
name = "ata42"
version = "0.1.0"
edition = "2021"

[dependencies]
xitca-web = { version = "0.6.2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
ring = "0.17.8"
anyhow = "1.0.94"

base64 = "0.22.1"
axum = "0.7.9"
clap = { version = "4.5.23", features = ["derive"] }
uuidv7 = "0.1.5"
tokio = "1.42.0"
reqwest = {version = "0.12.9", features = ["json", "rustls-tls"]}

[[bin]]
name = "cli"
path = "src/cli/main.rs"

[[bin]]
name = "signer"
path = "src/authority_signer/main.rs"


[[bin]]
name = "stamper"
path = "src/stamper/main.rs"

[[bin]]
name = "front"
path = "src/front_server/main.rs"


[profile.release]
strip = true
lto =true
